[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odineye-wtbd-merge-scale"
version = "1.0.0"
description = "Merge-only VGGT-unit evidential BEV plus parallel metric scale"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "torch>=2.5",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
void-audit = ["scipy>=1.10"]

[project.scripts]
odineye-p1b-legacy-train = "vggt_bev_method1.cli_train_metric:main"
odineye-p1b-freeze-split = "vggt_bev_method1.cli_freeze_split:main"
odineye-p1b-train = "vggt_bev_method1.cli_train_p1b:main"
odineye-p1b-eval = "vggt_bev_method1.cli_eval_p1b:main"
odineye-p1b-void-audit = "p1b_void_audit.cli:main"
odineye-p1b-single-astar = "vggt_bev_method1.cli_realtime_astar:main"
odineye-wtbd-train = "vggt_bev_method1.cli_train_wtbd:main"
odineye-wtbd-scale-audit = "vggt_bev_method1.cli_audit_wtbd_scale:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
