[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odineye-p2b"
version = "3.1.0"
description = "Two-expert FOV-complete BEVs with NLL/BCE variants and metric scale"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "torch>=2.5",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
odineye-p1b-train = "vggt_bev_method1.cli_train_metric:main"
odineye-p1b-freeze-split = "vggt_bev_method1.cli_freeze_split:main"
odineye-p2b-train = "vggt_bev_method1.cli_train_p2b:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
