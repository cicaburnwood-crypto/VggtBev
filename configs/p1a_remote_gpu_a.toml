[data]
root = "/data/project/VGGT_DATA/data_build_unlimited"
supervision = "joint"
coordinate_mode = "camera_height_anchored_fixed_normalized_scale"
single_target_extent_m = 6.5
merged_target_extent_m = 10.0
image_height = 384
image_width = 512
sample_stride = 1
minimum_history = 1
maximum_history = 10
sampling_mode = "one_prefix_per_session"
validation_fraction = 0.10
split_seed = 17
split_manifest = "/data/project/vggt/VGGTBEV_Method1/manifests/data_build_unlimited_p1a_fov_complete_v3.json"

[model]
pipeline_variant = "p1a_cascade"
runtime_metric_anchor = "camera_height_m"
vggt_source = "/data/project/vggt/VGGTBEV_Method1/vendor/backbone"
checkpoint = "/data/project/vggt/VGGTBEV_Method1/checkpoints/model.pt"
patch_size = 16
cached_layers = [4, 11, 17, 23]
spatial_scales = [4.0, 2.0, 1.0, 0.5]
vggt_token_dim = 2048
hidden_dim = 64
geometry_cue_dim = 24
attention_heads = 8
decoder_layers = 2
self_attention_mode = "linear"
cross_attention_mode = "deformable"
deformable_samples = 4
cross_query_chunk_size = 8192
query_parameter_chunk_size = 32768
single_output_size = 512
merged_output_size = 800
single_output_extent_normalized_scale = 6.5
merged_output_extent_normalized_scale = 10.0
geometry_sample_stride = 4
geometry_confidence_threshold = 0.25
geometry_minimum_points = 64
geometry_minimum_ground_quality = 0.05
geometry_ransac_hypotheses = 48
geometry_huber_iterations = 4
geometry_fov_chunk_size = 65536
gradient_checkpointing = true

[training]
pipeline = "paired_evidential"
enabled_models = ["complete_evidential"]
device = "cuda"
required_cuda_devices = 4
distributed_backend = "nccl"
require_same_numa = true
nccl_p2p_level = "AUTO"
ddp_bucket_cap_mb = 25
nccl_timeout_seconds = 300
epochs = 10
batch_size = 1
num_workers = 4
observed_learning_rate = 0.0001
complete_learning_rate = 0.0001
weight_decay = 0.0001
observed_known_weight = 1.0
observed_free_weight = 1.0
observed_surface_weight = 0.35
# Keep guessed free/occupied balanced; macro Dice handles residual imbalance.
guessed_completion_class_weights = [1.0, 1.0]
guessed_completion_nll_weight = 1.0
guessed_completion_dice_weight = 0.20
observed_region_weight = 1.0
guessed_region_weight = 0.25
incorrect_evidence_weight = 0.05
observation_relation_weight = 0.10
confidence_calibration_weight = 0.25
guessed_incorrect_evidence_multiplier = 4.0
guessed_confidence_calibration_multiplier = 8.0
evidence_relation_margin = 0.10
surface_tolerance_m = 0.05
guessed_supervision_warmup_fraction = 0.05
guessed_supervision_ramp_fraction = 0.10
direct_priority_pcgrad = true
maximum_guessed_to_direct_gradient_ratio = 0.25
confidence_regularizer_warmup_epochs = 0
confidence_regularizer_ramp_epochs = 1
single_task_weight = 0.5
merged_task_weight = 0.5
seed = 17
log_every_steps = 10
checkpoint_every_steps = 500
validation_batches = 200
geometry_warmup_epochs = 0
geometry_ramp_epochs = 0
output_dir = "/data/project/vggt/VGGTBEV_Method1/runs/p1a_fov_complete_v3"
