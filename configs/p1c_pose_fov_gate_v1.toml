[data]
root = "data/dense_workers"
supervision = "metric_fov_complete_evidential"
coordinate_mode = "p1b_fixed_metric"
gt_depth_convention = "camera_axis_z_depth_m"
single_bev_extent_m = 6.5
single_bev_output_size = 512
merged_source_extent_m = 10.0
merged_bev_extent_m = 6.5
merged_bev_output_size = 512
image_height = 384
image_width = 512
sample_stride = 1
minimum_history = 1
maximum_history = 10
sampling_mode = "one_prefix_per_session"
allow_active_writer_completed_snapshot = true
maximum_sessions = 36000
session_selection_order = "completion_time"
verify_manifest_metadata_at_startup = false
verify_manifest_artifacts_at_startup = false
validation_fraction = 0.05
split_seed = 170815
split_manifest = "manifests/p1c_first36k.json"

[model]
pipeline_variant = "P1C-NLL"
probability_model = "evidential"
projector_layout = "branch-specific-single-merged-v1"
geometry_conditioning = "relative_se2_embedding"
vggt_source = "vendor/backbone"
checkpoint = "checkpoints/model.pt"
patch_size = 16
cached_layers = [4, 11, 17, 23]
spatial_scales = [4.0, 2.0, 1.0, 0.5]
vggt_token_dim = 2048
hidden_dim = 64
attention_heads = 8
decoder_layers = 2
scale_decoder_layers = 2
self_attention_mode = "linear"
cross_attention_mode = "deformable"
deformable_samples = 4
cross_query_chunk_size = 65536
single_latent_bev_size = 512
merged_latent_bev_size = 512
single_bev_output_size = 512
merged_bev_output_size = 512
single_bev_extent_m = 6.5
merged_bev_extent_m = 6.5
predict_scale_uncertainty = true
pose_hidden_dim = 256
pose_attention_heads = 8
pose_layers = 4
pose_refinements = 3
maximum_history = 10
pose_conditioning_detach = false

[scale_fit]
confidence_threshold = 0.2
minimum_depth_m = 0.05
maximum_depth_m = 80.0
residual_threshold_log = 0.25
huber_delta_log = 0.05
minimum_valid_pixels = 1024
maximum_pixels_per_frame = 8192
minimum_inlier_ratio = 0.35
minimum_quality_weight = 0.10
quality_sigma_log = 0.10
desired_log_depth_range = 2.0
irls_iterations = 4

[teacher_cache]
mode = "live"
root = "cache/unused_live"

[training]
pipeline = "P1C-NLL"
stage = "bev_only"
bev_objective = "fov_support_and_observed_gate"
support_loss_variant = "role_balanced_contour"
enabled_bev_branches = ["merged"]
freeze_single_to_baseline = true
single_baseline_checkpoint = "checkpoints/baselines/p1b_stage1_36k_surface_nll_epoch10_step14320.pt"
fresh_merged_routing_initialization = true
seed_merged_routing_from_single = false
pose_warmstart_checkpoint = "checkpoints/p1c_pose_stage1_best.pt"
device = "cuda"
required_cuda_devices = 1
distributed_backend = "nccl"
require_same_numa = false
nccl_p2p_level = "AUTO"
nccl_timeout_seconds = 300
ddp_bucket_cap_mb = 25
ddp_broadcast_buffers = false
ddp_gradient_as_bucket_view = true
ddp_static_graph = true
epochs = 5
batch_size = 2
num_workers = 8
persistent_workers = true
prefetch_factor = 4
learning_rate = 0.0001
minimum_learning_rate = 0.00001
weight_decay = 0.02
warmup_fraction = 0.03
gradient_clip_norm = 1.0
bev_loss_weight = 1.0
single_task_weight = 0.0
merged_task_weight = 1.0
observed_gate_pixel_weight = 1.0
observed_gate_start_fraction = 0.10
observed_gate_ramp_fraction = 0.15
observed_gate_loss_variant = "role_balanced_contour"
observed_gate_boundary_radius = 3
observed_gate_interior_weight = 0.20
observed_gate_edge_weight = 0.50
observed_gate_contour_weight = 0.20
observed_gate_dice_weight = 0.10
guessed_pixel_weight = 0.0
guessed_surface_weight = 0.0
guessed_free_weight = 0.0
guessed_visible_surface_weight = 0.0
guessed_hidden_occupied_weight = 0.0
wrong_evidence_kl_weight = 0.0
support_bce_weight = 0.0
support_dice_weight = 0.0
support_tversky_weight = 0.0
support_boundary_weight = 0.0
support_interior_weight = 0.25
support_edge_weight = 0.45
support_contour_weight = 0.20
support_region_dice_weight = 0.10
support_boundary_radius = 3
support_tversky_false_positive_weight = 0.70
support_tversky_false_negative_weight = 0.30
routing_boundary_start_fraction = 0.10
routing_boundary_ramp_fraction = 0.30
scale_loss_weight = 1.0
depth_scale_loss_weight = 0.5
uncertainty_loss_weight = 0.0
pose_loss_weight = 1.0
pose_translation_weight = 1.0
pose_yaw_weight = 0.5
pose_refinement_gamma = 1.5
pose_smooth_l1_beta_m = 0.10
compile_head = false
fused_optimizer = true
training_minimal_outputs = true
single_attention_checkpoint = false
merged_attention_checkpoint = false
seed = 170820
log_every_steps = 20
checkpoint_every_steps = 1000
validation_batches = 200
output_dir = "runs/p1c_first36k_pose_fov_gate_v1"
