[data]
root = "/opt/vggtbev/testdata"
supervision = "metric_fov_complete_evidential"
coordinate_mode = "p1b_fixed_metric"
gt_depth_convention = "camera_axis_z_depth_m"
single_bev_extent_m = 6.5
single_bev_output_size = 512
merged_bev_extent_m = 10.0
merged_bev_output_size = 800
image_height = 384
image_width = 512
sample_stride = 1
minimum_history = 1
maximum_history = 5
sampling_mode = "one_prefix_per_session"
validation_fraction = 0.25
split_seed = 17
split_manifest = "/opt/vggtbev/manifests/docker_4scene_fov_complete_v6.json"

[model]
pipeline_variant = "p1b_fov_complete_metric_scale"
vggt_source = "/opt/vggt"
checkpoint = "/opt/vggt/checkpoints/VGGT-Omega-1B-512/model.pt"
patch_size = 16
cached_layers = [4, 11, 17, 23]
spatial_scales = [4.0, 2.0, 1.0, 0.5]
vggt_token_dim = 2048
hidden_dim = 64
attention_heads = 8
decoder_layers = 2
scale_decoder_layers = 2
self_attention_mode = "linear"
cross_attention_mode = "deformable"
deformable_samples = 4
cross_query_chunk_size = 4096
single_latent_bev_size = 64
merged_latent_bev_size = 80
single_bev_output_size = 512
merged_bev_output_size = 800
single_bev_extent_m = 6.5
merged_bev_extent_m = 10.0
predict_scale_uncertainty = true

[scale_fit]
confidence_threshold = 0.2
minimum_depth_m = 0.05
maximum_depth_m = 80.0
residual_threshold_log = 0.25
huber_delta_log = 0.05
minimum_valid_pixels = 1024
maximum_pixels_per_frame = 8192
minimum_inlier_ratio = 0.35
quality_sigma_log = 0.10
desired_log_depth_range = 2.0
irls_iterations = 4

[teacher_cache]
mode = "live"
root = "/workspace/cache/teacher"

[training]
pipeline = "p1b_fov_complete_metric_scale"
stage = "joint"
device = "cuda"
required_cuda_devices = 2
distributed_backend = "nccl"
require_same_numa = true
nccl_p2p_level = "AUTO"
ddp_bucket_cap_mb = 25
nccl_timeout_seconds = 300
epochs = 1
batch_size = 1
num_workers = 0
learning_rate = 0.0001
weight_decay = 0.02
warmup_fraction = 0.05
gradient_clip_norm = 1.0
guessed_completion_class_weights = [1.0, 1.0]
bev_loss_weight = 1.0
single_task_weight = 0.5
merged_task_weight = 0.5
observed_free_nll_weight = 1.0
observed_surface_nll_weight = 0.35
guessed_completion_nll_weight = 1.0
guessed_completion_dice_weight = 0.2
observed_region_weight = 1.0
guessed_region_weight = 0.25
surface_tolerance_latent_cell_fraction = 0.5
guessed_supervision_warmup_fraction = 0.05
guessed_supervision_ramp_fraction = 0.10
direct_priority_pcgrad = true
train_guessed_completion = true
maximum_guessed_to_direct_gradient_ratio = 0.0
fov_support_bce_weight = 0.5
fov_support_dice_weight = 0.5
incorrect_evidence_weight = 0.05
confidence_calibration_weight = 0.25
guessed_incorrect_evidence_multiplier = 1.0
guessed_confidence_calibration_multiplier = 1.0
observation_relation_weight = 0.10
evidence_relation_margin = 0.10
confidence_regularizer_warmup_epochs = 0
confidence_regularizer_ramp_epochs = 2
scale_loss_weight = 1.0
depth_scale_loss_weight = 0.5
uncertainty_loss_weight = 0.05
seed = 17
log_every_steps = 1
checkpoint_every_steps = 100
validation_batches = 4
output_dir = "/workspace/runs/docker_ddp2"
