[data]
root = "data/dense_workers"
supervision = "metric_fov_complete_evidential"
coordinate_mode = "metric_source_to_vggt_units"
gt_depth_convention = "camera_axis_z_depth_m"
merged_source_extent_m = 10.0
merged_source_output_size = 800
image_height = 384
image_width = 512
sample_stride = 1
minimum_history = 1
maximum_history = 10
sampling_mode = "one_prefix_per_session"
maximum_sessions = 80000
session_selection_order = "completion_time"
verify_manifest_metadata_at_startup = false
verify_manifest_artifacts_at_startup = false
validation_fraction = 0.05
split_seed = 170815
split_manifest = "manifests/wtbd_first80k.json"

[model]
pipeline_variant = "WTBD-MERGE-SCALE-NLL"
probability_model = "evidential"
geometry_conditioning = "native_vggt_extrinsics"
vggt_source = "vendor/backbone"
checkpoint = "checkpoints/model.pt"
patch_size = 16
cached_layers = [4, 11, 17, 23]
spatial_scales = [4.0, 2.0, 1.0, 0.5]
vggt_token_dim = 2048
hidden_dim = 64
attention_heads = 8
decoder_layers = 2
scale_decoder_layers = 2
self_attention_mode = "linear"
cross_attention_mode = "deformable"
deformable_samples = 4
cross_query_chunk_size = 8192
merged_latent_bev_size = 100
merged_bev_output_size = 800
# VGGT units, not metres. Freeze this only after the Stage-0 lambda audit.
merged_bev_extent_vggt = 6.5
native_query_resolution = false
predict_scale_uncertainty = true

[scale_fit]
confidence_threshold = 0.2
minimum_depth_m = 0.05
maximum_depth_m = 80.0
residual_threshold_log = 0.25
huber_delta_log = 0.05
minimum_valid_pixels = 1024
maximum_pixels_per_frame = 8192
minimum_inlier_ratio = 0.35
minimum_quality_weight = 0.10
quality_sigma_log = 0.10
desired_log_depth_range = 2.0
irls_iterations = 4

[teacher_cache]
mode = "live"
root = "cache/wtbd_teacher"

[training]
pipeline = "WTBD-MERGE-SCALE-NLL"
stage = "joint"
initialization = "fresh"
device = "cuda"
required_cuda_devices = 1
distributed_backend = "nccl"
require_same_numa = false
nccl_p2p_level = "AUTO"
nccl_timeout_seconds = 300
ddp_static_graph = true
epochs = 10
batch_size = 1
num_workers = 8
persistent_workers = true
prefetch_factor = 4
learning_rate = 0.0001
minimum_learning_rate = 0.00001
weight_decay = 0.02
warmup_fraction = 0.03
gradient_clip_norm = 1.0
bev_loss_weight = 1.0
observed_gate_pixel_weight = 1.0
guessed_pixel_weight = 1.0
guessed_surface_weight = 0.5
guessed_free_weight = 0.35
guessed_visible_surface_weight = 0.40
guessed_hidden_occupied_weight = 0.25
hidden_occupied_zero_fraction = 0.10
hidden_occupied_ramp_fraction = 0.15
wrong_evidence_kl_weight = 0.005
wrong_evidence_zero_fraction = 0.20
wrong_evidence_ramp_fraction = 0.10
support_bce_weight = 0.5
support_dice_weight = 0.5
scale_loss_weight = 1.0
depth_scale_loss_weight = 0.5
uncertainty_loss_weight = 0.05
fused_optimizer = true
seed = 170820
log_every_steps = 20
checkpoint_every_steps = 1000
validation_batches = 200
output_dir = "runs/wtbd_merge_scale_first80k_fresh_v1"
