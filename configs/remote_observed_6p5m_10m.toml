epochs = 10
batch_size = 1
num_workers = 4
learning_rate = 0.0001
weight_decay = 0.0001
occupancy_weight = 1.0
observation_weight = 0.5
dice_weight = 0.25
single_task_weight = 0.5
merged_task_weight = 0.5
seed = 17
log_every_steps = 10
checkpoint_every_steps = 500
validation_batches = 200
geometry_warmup_epochs = 1
geometry_ramp_epochs = 2
output_dir = "/data/project/vggt/VGGTBEV_Method1/runs/data_build_unlimited_observed_6p5m_10m_pdf_v4"
