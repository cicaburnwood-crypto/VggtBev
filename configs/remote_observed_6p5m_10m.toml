[data]
root = "/data/project/VGGT_DATA/data_build_unlimited"
supervision = "observed"
coordinate_mode = "vggt_scene_radius_normalized"
single_target_extent_m = 6.5
merged_target_extent_m = 10.0
image_height = 384
image_width = 512
sample_stride = 1
minimum_history = 1
maximum_history = 34
validation_fraction = 0.10
split_seed = 17
split_manifest = "/data/project/vggt/VGGTBEV_Method1/manifests/data_build_unlimited_method1_v4_disk7t.json"

[model]
vggt_source = "/data/project/vggt"
checkpoint = "/data/project/vggt/checkpoints/VGGT-Omega-1B-512/model.pt"
patch_size = 16
cached_layers = [4, 11, 17, 23]
spatial_scales = [4.0, 2.0, 1.0, 0.5]
vggt_token_dim = 2048
hidden_dim = 64
geometry_cue_dim = 14
