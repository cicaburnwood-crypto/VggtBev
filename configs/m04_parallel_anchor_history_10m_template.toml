[data]
root = "data/dense_workers"
supervision = "metric_fov_complete_evidential"
coordinate_mode = "metric_source_to_vggt_units"
gt_depth_convention = "camera_axis_z_depth_m"
# M04 deliberately keeps the existing data assets. These PNGs are 10 m
# source maps at 512x512 and are regridded to the native VGGT-unit target.
merged_source_extent_m = 10.0
merged_source_image_size = 512
merged_complete_directory = "merged_complete_10m"
merged_masked_directory = "merged_masked_10m"
# Keep the stored GT and M04 supervision tensor at native 512 resolution.
# The target transform changes coordinates only; it never upsamples.
merged_source_output_size = 512
image_height = 384
image_width = 512
sample_stride = 1
minimum_history = 1
maximum_history = 10
sampling_mode = "one_prefix_per_session"
maximum_sessions = 260000
session_selection_order = "completion_time"
verify_manifest_metadata_at_startup = true
verify_manifest_artifacts_at_startup = true
validation_fraction = 0.05
split_seed = 170815
split_manifest = "manifests/wtbd_first260k_completion.json"

[model]
pipeline_variant = "M04-PARALLEL-ANCHOR-HISTORY-MERGED-SCALE-NLL"
probability_model = "evidential"
geometry_conditioning = "parallel_latest_anchor_and_implicit_history"
vggt_source = "vendor/backbone"
checkpoint = "checkpoints/model.pt"
patch_size = 16
cached_layers = [4, 11, 17, 23]
spatial_scales = [4.0, 2.0, 1.0, 0.5]
vggt_token_dim = 2048
hidden_dim = 64
attention_heads = 8
latest_decoder_layers = 2
history_decoder_layers = 2
scale_decoder_layers = 2
self_attention_mode = "linear"
deformable_samples = 4
cross_query_chunk_size = 8192
merged_bev_output_size = 512
merged_bev_extent_vggt = 6.5
native_query_resolution = true
query_fourier_bands = 4
refinement_layers = 1
predict_scale_uncertainty = true
implicit_geometry_hidden_dim = 256
implicit_geometry_heads = 8
implicit_geometry_layers = 4
maximum_history = 10
maximum_prefix_tokens = 17
frame_reliability_hidden_dim = 256
frame_reliability_minimum = 0.25
frame_reliability_maximum = 1.75

[scale_fit]
confidence_threshold = 0.2
minimum_depth_m = 0.05
maximum_depth_m = 80.0
residual_threshold_log = 0.25
huber_delta_log = 0.05
minimum_valid_pixels = 1024
maximum_pixels_per_frame = 8192
minimum_inlier_ratio = 0.35
minimum_quality_weight = 0.10
quality_sigma_log = 0.10
desired_log_depth_range = 2.0
irls_iterations = 4

[teacher_cache]
mode = "live"
root = "cache/m04_teacher"

[training]
pipeline = "M04-PARALLEL-ANCHOR-HISTORY-MERGED-SCALE-NLL"
stage = "joint"
initialization = "fresh"
device = "cuda"
required_cuda_devices = 1
distributed_backend = "nccl"
require_same_numa = false
nccl_p2p_level = "AUTO"
nccl_timeout_seconds = 300
# N=1 structurally skips the history branch, while N>1 uses it. DDP must
# therefore support a changing used-parameter set across temporal buckets.
ddp_static_graph = false
ddp_find_unused_parameters = true
epochs = 15
batch_size = 1
num_workers = 8
persistent_workers = true
prefetch_factor = 4
learning_rate = 0.0001
minimum_learning_rate = 0.00001
weight_decay = 0.02
warmup_fraction = 0.03
gradient_clip_norm = 1.0
evidence_kl_weight = 0.001
scale_student_t_degrees_of_freedom = 3.0
scale_minimum_sigma_log = 0.02
scale_maximum_sigma_log = 2.0
# Existing 10 m supervision covers only the native cells that land inside it.
# Zero disables a per-batch hard failure; coverage is always logged/checkpointed.
minimum_mean_source_coverage = 0.0
fused_optimizer = true
compile_head = false
seed = 170820
log_every_steps = 20
checkpoint_every_steps = 5000
validation_batches = 500
output_dir = "runs/m04_parallel_anchor_history_first260k_15e_fresh_v1"
